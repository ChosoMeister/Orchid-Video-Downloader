name: Build and Release Extension ZIP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Pack extension into ZIP
        run: |
          cd dist
          zip -r ../orchid-downloader.zip .

      - name: Validate extension ZIP
        run: |
          test -s orchid-downloader.zip
          unzip -t orchid-downloader.zip
          unzip -Z1 orchid-downloader.zip | grep -Fxq manifest.json

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchid-downloader-zip
          path: orchid-downloader.zip
          if-no-files-found: error

      - name: Delete old release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gh release delete latest --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Build
          body: "Automated build of the latest changes on the main branch."
          files: |
            orchid-downloader.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
